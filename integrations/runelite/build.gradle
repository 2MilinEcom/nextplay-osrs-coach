plugins { id 'java' }
repositories { mavenLocal(); maven { url 'https://repo.runelite.net' }; mavenCentral() }
def runeLiteVersion = '1.13.1'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}
group='com.nextplay'
version='0.1.0'
java { sourceCompatibility=JavaVersion.VERSION_11; targetCompatibility=JavaVersion.VERSION_11 }
tasks.register('run', JavaExec) { classpath=sourceSets.test.runtimeClasspath; mainClass='com.nextplay.NextPlayLauncher'; args '--developer-mode' }
